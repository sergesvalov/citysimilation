<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>City Simulator</title>
</head>

<body>
    <div id="app">
        <!-- Interactive 2D Canvas -->
        <canvas id="city-canvas"></canvas>

        <!-- Top-Left Status HUD -->
        <div id="top-hud" class="glass-panel">
            <div class="hud-title-bar">
                <span class="hud-title">City Simulator</span>
                <div class="time-badge">
                    <span id="hud-sun-icon">☀️</span>
                    <span id="hud-clock">12:00</span>
                </div>
            </div>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Pop</div>
                    <div id="hud-population" class="stat-value">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Cars</div>
                    <div id="hud-cars" class="stat-value">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Traffic</div>
                    <div id="hud-congestion" class="stat-value congestion-low">0%</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Speed</div>
                    <div id="hud-speed" class="stat-value">0 km/h</div>
                </div>
            </div>
        </div>

        <!-- Top-Right Actions -->
        <div id="top-actions">
            <button id="btn-audio" class="btn-icon" title="Toggle Sound">🔊</button>
            <button id="btn-settings" class="btn-icon" title="Settings & Tools">⚙️</button>
        </div>

        <!-- Floating Zoom Controls -->
        <div id="zoom-controls">
            <button id="btn-zoom-in" class="btn-icon" title="Zoom In">➕</button>
            <button id="btn-zoom-out" class="btn-icon" title="Zoom Out">➖</button>
            <button id="btn-zoom-reset" class="btn-icon" title="Reset View">🎯</button>
        </div>

        <!-- Bottom Toolbar & Settings Drawer -->
        <div id="dock-container">
            <!-- Collapsible Settings Panel -->
            <div id="settings-panel" class="glass-panel hidden">
                <div class="setting-row">
                    <div class="setting-header">
                        <span>Time of Day</span>
                        <span id="time-label">12:00</span>
                    </div>
                    <input type="range" id="time-slider" min="0" max="24" step="0.25" value="12">
                </div>

                <div class="setting-row">
                    <div class="setting-header">
                        <span>Traffic Light Cycle</span>
                        <span id="light-label">2.2s</span>
                    </div>
                    <input type="range" id="light-slider" min="600" max="5000" step="100" value="2200">
                </div>

                <div class="action-buttons-row">
                    <button id="btn-camera" class="btn-primary">📷 Map from Photo</button>
                    <button id="btn-regen" class="btn-secondary">🎲 Regenerate</button>
                </div>
                <button id="btn-clear" class="btn-secondary btn-danger">🧹 Clear City</button>
            </div>

            <!-- Main Building & Tool Dock -->
            <div id="dock-tools" class="glass-panel">
                <button class="tool-btn" data-tool="pan" title="Pan Map">
                    <span class="icon">✋</span>
                    <span>Pan</span>
                </button>
                <button class="tool-btn" data-tool="inspect" title="Inspect / Toggle Lights">
                    <span class="icon">🔍</span>
                    <span>Inspect</span>
                </button>
                <button class="tool-btn active" data-tool="road" title="Build Road">
                    <span class="icon">🛣️</span>
                    <span>Road</span>
                </button>
                <button class="tool-btn" data-tool="highway" title="Build Highway">
                    <span class="icon">🛣️</span>
                    <span>Highway</span>
                </button>
                <button class="tool-btn" data-tool="house" title="Build House">
                    <span class="icon">🏡</span>
                    <span>House</span>
                </button>
                <button class="tool-btn" data-tool="commercial" title="Build Commercial Tower">
                    <span class="icon">🏢</span>
                    <span>Office</span>
                </button>
                <button class="tool-btn" data-tool="tree" title="Plant Tree / Park">
                    <span class="icon">🌳</span>
                    <span>Park</span>
                </button>
                <button class="tool-btn" data-tool="water" title="Dig River / Water">
                    <span class="icon">💧</span>
                    <span>Water</span>
                </button>
                <button class="tool-btn" data-tool="light" title="Place Traffic Light">
                    <span class="icon">🚥</span>
                    <span>Light</span>
                </button>
                <button class="tool-btn" data-tool="bulldozer" title="Demolish">
                    <span class="icon">🚜</span>
                    <span>Bulldoze</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Application Entry Point -->
    <script type="module" src="/main.js"></script>
</body>

</html>
